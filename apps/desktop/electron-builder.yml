appId: com.designfabric.app
productName: DesignFabric
executableName: DesignFabric
copyright: Copyright © DesignFabric
electronVersion: 43.1.1
directories:
  output: ../../dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../VERSION
    to: VERSION
  - from: ../../backend
    to: backend
    filter:
      - "src/**/*"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!.venv"
      - "!output"
      - "!.pytest_cache"
asar: true
linux:
  target:
    - AppImage
  category: Graphics
  artifactName: DesignFabric-${version}-${arch}.AppImage
  executableName: DesignFabric
  extraResources:
    - from: ../../packaging/vendor/uv/linux-x64/uv
      to: uv/uv
win:
  target:
    - portable
  artifactName: DesignFabric-${version}-win-${arch}.exe
  extraResources:
    - from: ../../packaging/vendor/uv/win-x64/uv.exe
      to: uv/uv.exe
portable:
  artifactName: DesignFabric-${version}-win-${arch}.exe
npmRebuild: false
