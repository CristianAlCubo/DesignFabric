appId: com.designfabricv2.app
productName: DesignFabricV2
executableName: DesignFabricV2
copyright: Copyright © DesignFabricV2
electronVersion: 36.9.5
directories:
  output: ../../dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../backend
    to: backend
    filter:
      - "src/**/*"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!.venv"
      - "!output"
      - "!.pytest_cache"
asar: true
linux:
  target:
    - AppImage
  category: Graphics
  artifactName: DesignFabricV2-${version}-${arch}.AppImage
  executableName: DesignFabricV2
  extraResources:
    - from: ../../packaging/vendor/uv/linux-x64/uv
      to: uv/uv
win:
  target:
    - portable
  artifactName: DesignFabricV2-${version}-win-${arch}.exe
  extraResources:
    - from: ../../packaging/vendor/uv/win-x64/uv.exe
      to: uv/uv.exe
portable:
  artifactName: DesignFabricV2-${version}-win-${arch}.exe
npmRebuild: false
